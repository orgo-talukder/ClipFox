<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e14">
  <title>Clipfox</title>
  <link rel="preload" href="fonts/SpaceGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <img class="brand-mark" src="brand/clipfox-mark.svg" width="36" height="36" alt="">
      <div class="brand-copy">
        <h1 class="brand-name">
          <img class="brand-wordmark" src="brand/clipfox-wordmark.svg" width="94" height="26" alt="Clipfox">
        </h1>
        <p class="brand-tagline">YouTube Link Extractor</p>
      </div>
      <div class="count-badge" id="count-badge" aria-label="0 links detected">
        <span class="count-number" id="link-count">0</span>
        <span class="count-label" id="link-label">links</span>
      </div>
    </header>

    <div class="page-strip">
      <svg class="icon" width="12" height="12" aria-hidden="true"><use href="#i-globe"></use></svg>
      <span class="page-host" id="page-host" title="">Current tab</span>
      <span class="page-divider" aria-hidden="true"></span>
      <span class="scan-time" id="scan-time">Ready</span>
    </div>

    <section class="controls" id="controls" aria-label="Scan and copy actions" hidden>
      <div class="search-field">
        <svg class="search-icon icon" width="14" height="14" aria-hidden="true"><use href="#i-search"></use></svg>
        <label class="sr-only" for="search-input">Search extracted links</label>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search title or URL">
        <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>
          <svg class="icon" width="12" height="12" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="action-row">
        <button id="rescan-btn" class="btn btn-secondary" type="button">
          <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-refresh"></use></svg>
          <span>Rescan</span>
        </button>
        <button id="watch-btn" class="btn btn-secondary btn-watch" type="button" aria-pressed="false" title="Refresh automatically when the page player changes">
          <span class="watch-dot" aria-hidden="true"></span>
          <span id="watch-label">Watch</span>
        </button>
        <button id="copy-all-btn" class="btn btn-primary" type="button" disabled>
          <svg class="icon" width="14" height="14" aria-hidden="true"><use href="#i-copy"></use></svg>
          <span id="copy-all-label">Copy all</span>
        </button>
      </div>
      <div class="copy-row">
        <label class="copy-label" for="copy-format">Copy as</label>
        <select id="copy-format" class="select" aria-label="Copy format">
          <option value="urls">URLs</option>
          <option value="title-url">Title + URL</option>
          <option value="markdown">Markdown</option>
          <option value="csv">CSV</option>
          <option value="json">JSON</option>
          <option value="ids">Video IDs</option>
        </select>
        <button id="export-btn" class="btn btn-secondary btn-export" type="button" disabled title="Download the current results as a file">
          <svg class="icon" width="13" height="13" aria-hidden="true"><use href="#i-download"></use></svg>
          <span>Export</span>
        </button>
      </div>
    </section>

    <div id="filters" class="filters" role="group" aria-label="Filter links by category" hidden></div>

    <main class="results-area" id="results-area">
      <div class="results-scroll" id="results-scroll">
        <div id="results" class="results" role="list" aria-label="Extracted YouTube links" hidden></div>

        <div id="state-panel" class="state-panel" hidden>
          <div class="state-icon" id="state-icon" aria-hidden="true"></div>
          <h2 class="state-title" id="state-title"></h2>
          <p class="state-message" id="state-message"></p>
          <div class="state-actions">
            <button id="state-action" class="btn btn-secondary state-action" type="button" hidden></button>
            <button id="state-diagnostics" class="btn btn-quiet state-diagnostics" type="button" hidden>
              <svg class="icon" width="12" height="12" aria-hidden="true"><use href="#i-bug"></use></svg>
              <span>Copy diagnostics</span>
            </button>
          </div>
        </div>

        <div id="load-more-wrap" class="load-more-wrap" hidden>
          <button id="load-more-btn" class="btn btn-quiet" type="button">Show more</button>
          <p id="render-summary" class="render-summary"></p>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <div class="status-line">
        <span id="status-dot" class="status-dot" data-tone="idle" aria-hidden="true"></span>
        <span id="footer-status" class="footer-status" title="">Ready. Click Scan this page to find YouTube links.</span>
      </div>
      <div class="footer-actions">
        <p class="footer-note" title="Only page content the extension can access is inspected. Cross-origin frames are skipped.">Local only · No network requests.</p>
        <button id="settings-btn" class="footer-link" type="button" title="Open Clipfox settings">
          <svg class="icon" width="11" height="11" aria-hidden="true"><use href="#i-settings"></use></svg>
          <span>Settings</span>
        </button>
      </div>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
    <span id="toast-icon" class="toast-icon" aria-hidden="true"></span>
    <span id="toast-message" class="toast-message"></span>
  </div>

  <p id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></p>

  <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m20 20-4.2-4.2"></path></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.9 5"></path><path d="M20 4v7h-7"></path></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"></rect><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"></path></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6"></path><path d="M20 4 11.5 12.5"></path><path d="M18 14.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5"></path></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"></path></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.2 3.4 19.2a1 1 0 0 0 .9 1.5h15.4a1 1 0 0 0 .9-1.5L12 4.2Z"></path><path d="M12 9.5v4.5"></path><path d="M12 17.3h.01"></path></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.8 9.5h16.4M3.8 14.5h16.4"></path><path d="M12 3.5c2.3 2.4 3.4 5.3 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.3-3.4-8.5S9.7 5.9 12 3.5Z"></path></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10" rx="2.5"></rect><path d="M8 10V7.8a4 4 0 0 1 8 0V10"></path><path d="M12 14v2.5"></path></symbol>
    <symbol id="i-empty" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="4"></rect><path d="m10 9.6 4 2.4-4 2.4V9.6Z"></path><path d="M4 4 20 20"></path></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"></path><path d="m7.5 10.5 4.5 4.5 4.5-4.5"></path><path d="M5 19h14"></path></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.95 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.95a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.95 4.6 1.7 1.7 0 0 0 9.98 3.04V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9.98a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"></path></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="13" rx="5"></rect><path d="M9 4.5 7.5 7M15 4.5 16.5 7M3.5 11H7M17 11h3.5M3.5 16H7M17 16h3.5M9 10.5h6"></path></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4 7 20M17 4l-2.5 16M4.5 9h16M3.5 15h16"></path></symbol>
  </svg>

  <script src="extractor.js" defer></script>
  <script src="popup.js" defer></script>
</body>
</html>
