<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipfox - Background Harness</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e14;
      --panel: #121824;
      --border: #222b3a;
      --text: #eef1f6;
      --muted: #96a0af;
      --accent: #8b7bff;
      --green: #45d6a0;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      background:
        radial-gradient(900px 460px at 88% -10%, rgba(139, 123, 255, 0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font: 13px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    main { max-width: 900px; margin: 0 auto; }
    .kicker {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 23px; letter-spacing: -0.02em; }
    .lede { margin: 5px 0 20px; color: var(--muted); font-size: 12.5px; }
    .panel {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }
    .check { margin: 5px 0; font-size: 12px; }
    .check.pass { color: #83e9bd; }
    .check.fail { color: #ff8391; }
    .label {
      margin: 16px 0 5px;
      color: #6d7786;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    pre {
      margin: 0;
      padding: 9px 10px;
      border: 1px solid #252c36;
      border-radius: 8px;
      background: #0e1116;
      color: #aeb8c6;
      font: 10.5px/1.5 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 220px;
      overflow: auto;
    }
    .error-banner {
      display: none;
      margin-top: 12px;
      padding: 9px 11px;
      border: 1px solid rgba(139, 123, 255, 0.4);
      border-radius: 8px;
      background: rgba(139, 123, 255, 0.08);
      color: #ffb3bd;
      font-size: 11.5px;
    }
    #worker-frame { display: none; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Developer harness</p>
    <h1>Background worker under test</h1>
    <p class="lede">The real <code>background.js</code> running with a mocked <code>chrome.*</code> surface. The worker only clears per-tab badges on navigation and close; it must never use a network API.</p>
    <div class="panel">
      <div id="checks"></div>
      <p class="label">Badge writes</p>
      <pre id="mock-writes">[]</pre>
      <p class="label">Registered listeners</p>
      <pre id="mock-listeners">{}</pre>
      <div id="error-banner" class="error-banner"></div>
    </div>
  </main>
  <iframe id="worker-frame" title="Background worker under test"></iframe>
  <script src="background-harness.js"></script>
</body>
</html>
